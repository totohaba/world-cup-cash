<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Cup Cash</title>
    <link rel="stylesheet" href="styles.css?v=load-picks-1" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">World Cup Cash</p>
          <h1>Matches</h1>
        </div>
        <div class="balance-card">
          <span>Current Balance</span>
          <strong id="current-balance">$200</strong>
        </div>
      </header>

      <section class="phase-card">
        <h2 id="phase-name">Group Matchday 1</h2>
        <p id="phase-status">Loading game state...</p>
      </section>

      <section id="join-panel" class="panel join-panel" hidden>
        <h2>Join Game</h2>
        <p>Enter your name to join this browser to the family game.</p>
        <form id="join-form">
          <label for="display-name">Player name</label>
          <input id="display-name" name="displayName" type="text" autocomplete="name" required />
          <button type="submit">Join Game</button>
        </form>
      </section>

      <section id="player-panel" class="player-panel" hidden>
        <span>Signed in as</span>
        <strong id="player-name"></strong>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>Active Matches</h2>
          <button id="refresh-button" type="button">Refresh</button>
        </div>
        <div id="matches-list" class="matches-list"></div>
      </section>

      <nav class="bottom-nav" aria-label="Main navigation">
        <a class="active" href="index.html">Matches</a>
        <a href="#leaderboard">Leaderboard</a>
        <a href="#profile">My Profile</a>
        <a href="#rules">Rules</a>
      </nav>
    </main>

    <script src="app.js?v=load-picks-1"></script>
  </body>
</html>
