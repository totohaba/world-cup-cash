<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Cup Cash Admin</title>
    <link rel="stylesheet" href="styles.css?v=backend-groups-1" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">World Cup Cash</p>
          <h1>Admin</h1>
        </div>
        <a class="admin-link" href="index.html">Player App</a>
      </header>

      <section class="phase-card admin-current-phase">
        <p class="eyebrow">Current Phase</p>
        <h2 id="admin-current-phase-name">Loading phase...</h2>
        <div class="admin-phase-meta">
          <span id="admin-current-phase-status">Status: loading</span>
          <span id="admin-current-phase-lock">Locked in: --</span>
        </div>
        <div id="admin-dashboard-stats" class="mini-stat-row"></div>
      </section>

      <section class="panel admin-controls-panel">
        <div class="panel-heading">
          <h2>Admin Controls</h2>
          <span class="admin-badge">Admin</span>
        </div>
        <div class="admin-control-grid">
          <button class="admin-control-card" type="button" data-admin-tool="uploadTeams">
            <span class="control-icon">CSV</span>
            <strong>Upload Teams CSV</strong>
            <span>Upload or replace world_cup_cash_all_teams_v1.csv.</span>
          </button>
          <button class="admin-control-card" type="button" data-admin-tool="uploadMatches">
            <span class="control-icon">CSV</span>
            <strong>Upload Matches CSV</strong>
            <span>Upload or replace world_cup_cash_all_matches_odds_v1.csv.</span>
          </button>
          <button class="admin-control-card" type="button" data-admin-action="openNextPhase">
            <span class="control-icon">Play</span>
            <strong>Open Next Phase</strong>
            <span>Find the next phase and open betting.</span>
          </button>
          <button class="admin-control-card" type="button" id="odds-check-button">
            <span class="control-icon warning">!</span>
            <strong>Odds Check Status</strong>
            <span>Check active matches for required odds data.</span>
          </button>
          <button class="admin-control-card" type="button" data-admin-action="lockPhase">
            <span class="control-icon">Lock</span>
            <strong>Lock Current Phase</strong>
            <span>No more picks allowed. Existing bets remain.</span>
          </button>
          <button class="admin-control-card" type="button" data-settle-final-matches>
            <span class="control-icon">Cup</span>
            <strong>Finalize Results</strong>
            <span>Settle final matches with saved scores.</span>
          </button>
          <button class="admin-control-card" type="button" id="download-matches-button">
            <span class="control-icon">Down</span>
            <strong>Download Matches CSV</strong>
            <span>Download the current matches data.</span>
          </button>
          <button class="admin-control-card danger" type="button" data-admin-tool="resetGame">
            <span class="control-icon danger">Reset</span>
            <strong>Reset Game</strong>
            <span>Clear test gameplay before the real tournament.</span>
          </button>
        </div>
        <p id="admin-control-status" class="admin-match-status" aria-live="polite"></p>
        <div id="health-check-results" class="health-check-results"></div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>Phase Timeline</h2>
        </div>
        <div id="admin-phase-list" class="phase-list"></div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>Manual Results</h2>
          <button id="admin-refresh-button" type="button">Refresh</button>
        </div>
        <div id="admin-matches-list" class="admin-matches-list"></div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>Settlement Log</h2>
          <button id="log-refresh-button" type="button">Refresh</button>
        </div>
        <div id="settlement-log-list" class="settlement-log-list"></div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>Players</h2>
        </div>
        <div id="admin-player-list" class="player-roster-list"></div>
      </section>
    </main>
    <script src="admin.js?v=backend-groups-1"></script>
  </body>
</html>
